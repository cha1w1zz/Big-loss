<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Loss</title>
<style>
:root{--bg:#111418;--card:#1c2128;--tx:#e8eaed;--mu:#9aa3ad;--smoke:#f0a24a;--bet:#e5534b;--win:#3fb950;--line:#2a3038}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Thai",sans-serif}
main{max-width:520px;margin:auto;padding:16px}
h1{margin:4px 0;font-size:26px}h1 small{display:block;font-size:14px;color:var(--mu);font-weight:400}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1px solid #333;background:none;color:var(--tx);font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:none;color:var(--tx);font-size:15px}
.seg button.on{background:#2d333b;border-color:var(--mu)}
.nav{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.nav button{background:none;border:1px solid #333;color:var(--tx);border-radius:8px;width:40px;height:34px;font-size:16px}
.nav b{font-size:15px}
.net{font-size:34px;text-align:center;margin:8px 0 2px;font-weight:700}
.netl{text-align:center;color:var(--mu);font-size:13px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.tot b{display:block;font-size:17px}.tot span{font-size:12px;color:var(--mu)}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:12px 4px;border-radius:10px;border:2px solid #333;background:none;color:var(--tx);font-size:15px}
.tabs button.on[data-t=smoke]{border-color:var(--smoke)}.tabs button.on[data-t=bet]{border-color:var(--bet)}.tabs button.on[data-t=win]{border-color:var(--win)}
input{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #333;background:#0d1014;color:var(--tx);font-size:18px}
#add{width:100%;margin-top:10px;padding:14px;border:0;border-radius:10px;background:var(--win);color:#000;font-size:18px;font-weight:700}
ul{list-style:none;padding:0;margin:0}li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
li small{color:var(--mu)}li button{background:none;border:0;color:var(--mu);font-size:18px}
.smoke{color:var(--smoke)}.bet{color:var(--bet)}.win{color:var(--win)}
#who{color:var(--mu);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>💸 Big Loss<small>บันทึกอบายมุข — บุหรี่ &amp; พนัน</small></h1>
<div id="status" style="color:var(--mu);font-size:13px">กำลังเชื่อมต่อ…</div>

<div class="card">
  <div class="row" style="justify-content:space-between"><b>👤 โปรไฟล์</b><button class="chip" id="newP">➕ เพิ่มคน</button></div>
  <div class="chips" id="profiles" style="margin-top:8px"></div>
</div>

<div class="card">
  <div class="seg" id="period">
    <button data-p="day" class="on">วัน</button><button data-p="week">สัปดาห์</button><button data-p="month">เดือน</button><button data-p="all">ทั้งหมด</button>
  </div>
  <div class="nav"><button id="prev">‹</button><b id="plabel"></b><button id="next">›</button></div>
  <div class="net" id="net">฿0</div>
  <div class="netl" id="netl">กำไร / ขาดทุนสุทธิ</div>
  <div class="tot">
    <div><b class="win" id="sWin">฿0</b><span>🎉 ได้พนัน</span></div>
    <div><b class="bet" id="sBet">฿0</b><span>🎲 เสียพนัน</span></div>
    <div><b class="smoke" id="sSmoke">฿0</b><span>🚬 บุหรี่</span></div>
  </div>
</div>

<div class="card">
  <div class="tabs">
    <button data-t="smoke" class="on">🚬 บุหรี่</button>
    <button data-t="bet">🎲 เสียพนัน</button>
    <button data-t="win">🎉 ได้พนัน</button>
  </div>
  <input id="amt" type="number" inputmode="decimal" placeholder="จำนวนเงิน (บาท)">
  <input id="note" placeholder="โน้ต (ไม่ใส่ก็ได้)">
  <button id="add">บันทึก</button>
  <div id="who"></div>
</div>

<div class="card">
  <b>รายการในช่วงนี้</b>
  <ul id="list"></ul>
</div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbw66778SnrUEVS6pqxbUzGoTklcEyn40Sra7e5pdmzG7PGhpKXIUGtN4-2uh8xAVcq9ZQ/exec';
const ALL='__all__',NONE='ไม่ระบุ';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const baht=n=>(n<0?'-':'')+'฿'+Math.abs(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

let items=[],type='smoke',period='day',offset=0;
let profile=ls('bigloss-profile')||ALL;
let extraProfiles=ls('bigloss-extra')||[];
const setStatus=t=>$('status').textContent=t;

// ---------- ช่วงเวลา ----------
function range(){
  const n=new Date();let s,e,label;
  if(period==='day'){s=new Date(n.getFullYear(),n.getMonth(),n.getDate()+offset);e=new Date(s);e.setDate(s.getDate()+1);
    label=offset===0?'วันนี้':offset===-1?'เมื่อวาน':s.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}
  else if(period==='week'){const dow=(n.getDay()+6)%7;s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow+offset*7);e=new Date(s);e.setDate(s.getDate()+7);
    const l=new Date(e-1);label=(offset===0?'สัปดาห์นี้ · ':'')+s.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' – '+l.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
  else if(period==='month'){s=new Date(n.getFullYear(),n.getMonth()+offset,1);e=new Date(s.getFullYear(),s.getMonth()+1,1);
    label=(offset===0?'เดือนนี้ · ':'')+s.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}
  else{s=new Date(0);e=new Date(8.64e15);label='ทั้งหมด'}
  return{s:+s,e:+e,label};
}

// ---------- แสดงผล ----------
function profileList(){
  const set=new Set(extraProfiles);items.forEach(x=>set.add(x.p||NONE));
  return[...set].sort((a,b)=>a===NONE?1:b===NONE?-1:a.localeCompare(b,'th'));
}
function render(){
  const ps=profileList();
  if(profile!==ALL&&!ps.includes(profile))profile=ALL;
  $('profiles').innerHTML=[`<button class="chip${profile===ALL?' on':''}" data-p="${ALL}">👥 ทุกคน</button>`]
    .concat(ps.map(p=>`<button class="chip${p===profile?' on':''}" data-p="${esc(p)}">${esc(p)}</button>`)).join('');
  $('who').textContent=profile===ALL?'⚠️ เลือกโปรไฟล์ด้านบนก่อนบันทึก':'จะบันทึกในชื่อ: '+profile;

  const r=range();
  $('plabel').textContent=r.label;
  $('prev').style.visibility=$('next').style.visibility=period==='all'?'hidden':'visible';
  $('next').disabled=offset>=0;
  const rows=items.filter(x=>(profile===ALL||(x.p||NONE)===profile)&&x.d>=r.s&&x.d<r.e);
  const sum=t=>rows.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
  const win=sum('win'),bet=sum('bet'),smoke=sum('smoke'),net=win-bet-smoke;
  $('sWin').textContent=baht(win);$('sBet').textContent=baht(bet);$('sSmoke').textContent=baht(smoke);
  $('net').textContent=(net>0?'+':'')+baht(net);
  $('net').style.color=net>0?'var(--win)':net<0?'var(--bet)':'var(--tx)';
  $('netl').textContent=net>0?'🟢 กำไร':net<0?'🔴 ขาดทุน':'เท่าทุน';

  const icon={smoke:'🚬',bet:'🎲',win:'🎉'},sign={smoke:'-',bet:'-',win:'+'};
  $('list').innerHTML=rows.slice(0,100).map(x=>{
    const d=new Date(x.d).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
    const t=icon[x.t]?x.t:'smoke';
    return `<li><div><span class="${t}">${icon[t]} ${sign[t]}${baht(x.a)}</span> ${esc(x.n||'')}<br><small>${esc(x.p||NONE)} · ${d}</small></div><button data-id="${esc(x.id)}">✕</button></li>`;
  }).join('')||'<li><small>ยังไม่มีรายการในช่วงนี้</small></li>';
}

// ---------- ปุ่มต่างๆ ----------
$('profiles').onclick=e=>{const p=e.target.dataset.p;if(p){profile=p;ls('bigloss-profile',p);render()}};
$('newP').onclick=()=>{
  const n=(prompt('ชื่อโปรไฟล์ใหม่')||'').trim().slice(0,40);if(!n)return;
  if(!extraProfiles.includes(n)){extraProfiles.push(n);ls('bigloss-extra',extraProfiles)}
  profile=n;ls('bigloss-profile',n);render();
};
$('period').onclick=e=>{const p=e.target.dataset.p;if(!p)return;period=p;offset=0;
  document.querySelectorAll('#period button').forEach(b=>b.classList.toggle('on',b===e.target));render()};
$('prev').onclick=()=>{offset--;render()};
$('next').onclick=()=>{if(offset<0){offset++;render()}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  type=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
});
$('add').onclick=async()=>{
  if(profile===ALL)return alert('เลือกโปรไฟล์ (หรือกด ➕ เพิ่มคน) ก่อนบันทึก');
  const a=parseFloat($('amt').value);if(!(a>0))return $('amt').focus();
  const body={op:'add',t:type,a,n:$('note').value.trim(),p:profile};
  $('amt').value=$('note').value='';
  items.unshift({...body,id:'tmp'+Date.now(),d:Date.now()});period==='all'||(offset=0);render();
  try{await send(body)}catch(e){alert('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');pull()}
};
$('list').onclick=async e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(!id||!confirm('ลบรายการนี้?'))return;
  items=items.filter(x=>x.id!==id);render();
  try{await send({op:'del',id})}catch(e){alert('ลบไม่สำเร็จ');pull()}
};

// ---------- เชื่อม Google Sheets ----------
async function pull(){
  try{const r=await fetch(API);const d=await r.json();items=d.sort((x,y)=>y.d-x.d);render();setStatus('☁️ บันทึกออนไลน์ (Google Sheets) ใช้ร่วมกันทุกคน')}
  catch(e){setStatus('⚠️ เชื่อมต่อไม่ได้ ลองรีเฟรช')}
}
async function send(body){
  await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
  await pull();
}
render();pull();setInterval(pull,5000);
</script>
</body>
</html>
